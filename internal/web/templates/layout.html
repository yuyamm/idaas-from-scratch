{{define "head"}}<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - IdaaS</title>
<style>
body{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;background:#f4f5f7;margin:0;color:#1f2328}
main{max-width:420px;margin:48px auto;background:#fff;border-radius:12px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{font-size:1.3rem;margin:0 0 4px} .tenant{color:#57606a;font-size:.85rem;margin-bottom:24px}
label{display:block;font-size:.85rem;margin:16px 0 4px} input[type=text],input[type=password],input[type=email]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d0d7de;border-radius:6px;font-size:1rem}
button{width:100%;margin-top:20px;padding:10px;border:0;border-radius:6px;background:#0969da;color:#fff;font-size:1rem;cursor:pointer}
button.secondary{background:#eaeef2;color:#1f2328} .error{background:#ffebe9;color:#a40e26;padding:10px;border-radius:6px;font-size:.9rem}
.info{background:#ddf4ff;padding:10px;border-radius:6px;font-size:.9rem} .links{margin-top:20px;font-size:.85rem} code{background:#eaeef2;padding:2px 4px;border-radius:4px;word-break:break-all}
ul.codes{columns:2;font-family:monospace}
</style>
</head>
<body><main>
<h1>{{.Title}}</h1>{{if .TenantName}}<div class="tenant">{{.TenantName}}</div>{{end}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}{{if .Info}}<p class="info">{{.Info}}</p>{{end}}
{{end}}
{{define "foot"}}</main></body></html>{{end}}
